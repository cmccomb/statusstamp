name: LaTeX regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install TeX engines and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended tex-gyre lmodern texlive-xetex texlive-luatex
      - name: Install PDF checks
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r tests/requirements.txt
      - name: Check all supported TeX Live engines
        run: |
          failed=0
          for engine in pdflatex xelatex lualatex; do
            make check PYTHON=.venv/bin/python ENGINE="$engine" || failed=1
          done
          exit "$failed"
      - name: Build the README example sheet
        run: make gallery PYTHON=.venv/bin/python ENGINE=pdflatex
      - name: Build the Overleaf bundle
        run: make bundle PYTHON=.venv/bin/python
