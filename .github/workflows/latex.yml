name: LaTeX regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install TeX engines and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-xetex texlive-luatex
      - name: Install PDF checks
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r tests/requirements.txt
      - name: Check all supported TeX Live engines
        run: |
          for engine in pdflatex xelatex lualatex; do
            make check PYTHON=.venv/bin/python ENGINE="$engine"
          done
      - name: Build the Overleaf bundle
        run: make bundle PYTHON=.venv/bin/python
